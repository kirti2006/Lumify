<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lumify-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lumify — AI-Powered Adaptive Mock Interview Platform. Get personalized interview questions, adaptive difficulty, and detailed AI feedback." />
    <meta name="keywords" content="AI interview, mock interview, interview preparation, adaptive interview, Lumify" />
    <meta property="og:title" content="Lumify — AI Mock Interview Platform" />
    <meta property="og:description" content="Practice smarter with AI-powered adaptive interviews personalized to your resume and target role." />
    <meta property="og:type" content="website" />
    <title>Lumify — AI Powered Adaptive Mock Interview Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var theme = localStorage.getItem("lumify-theme");
        if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
