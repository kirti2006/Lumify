[project]
name = "lumify-ms2"
version = "1.0.0"
description = "Lumify AI Microservice MS-2 — LangGraph interview orchestration with Groq LLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "redis>=5.0.8",
    "langgraph>=0.2.34",
    "langchain>=0.3.4",
    "groq>=0.11.0",
    "python-jose[cryptography]>=3.3.0",
    "celery>=5.4.0",
    "loguru>=0.7.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "duckduckgo-search>=8.1.1",
    "langchain-community>=0.4.2",
    "youtube-search-python>=1.6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.4",
    "mypy>=1.11.2",
    "types-python-dateutil>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "api", "app", "agents", "config", "dependencies", "graph", 
    "llm", "memory", "middleware", "models", "repositories", 
    "schemas", "services", "utils", "workers"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
disallow_untyped_defs = false
